<!DOCTYPE html>
  <!--
  PROTOTYPE — throwaway. Main layout prototype (r2b — password Entries on B).
  Question: IDE chrome B + how password-ish Entries look (still one flexible Entry type; secrets in Body).
  ?variant=A|B|C  ·  ←/→ or floating bar
  Default: B + GitHub login Entry
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kakuriyo — main layout prototype (r2b passwords)</title>
  <style>
    :root {
      --bg: #000000;
      --bg-1: #050505;
      --bg-2: #0a0a0a;
      --bg-3: #111111;
      --bg-4: #1a1a1a;
      --line: #222222;
      --line-2: #2e2e2e;
      --text: #e8e8e8;
      --muted: #7a7a7a;
      --dim: #555555;
      --accent: #c8c8c8;
      --accent-hot: #ffffff;
      --focus: #ffffff;
      --sel: #1c1c1c;
      --font: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
      --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--ui);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    button, input { font: inherit; color: inherit; background: transparent; border: none; }
    :focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }

    .app { height: 100%; display: flex; flex-direction: column; }
    .titlebar {
      height: 36px; flex: 0 0 auto;
      display: flex; align-items: center; gap: 12px;
      padding: 0 12px; background: var(--bg); border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
    }
    .brand { font-family: var(--font); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
    .brand b { font-weight: 600; color: var(--accent-hot); }
    .muted { color: var(--muted); }
    .spacer { flex: 1; }
    .tb-btn {
      font-family: var(--font); font-size: 11px; color: var(--muted);
      padding: 4px 8px; border: 1px solid transparent; cursor: pointer;
    }
    .tb-btn:hover { color: var(--text); border-color: var(--line-2); background: var(--bg-3); }

    .statusbar {
      height: 22px; flex: 0 0 auto;
      display: flex; align-items: center; gap: 16px;
      padding: 0 10px; background: var(--bg); border-top: 1px solid var(--line);
      font-family: var(--font); font-size: 10px; color: var(--dim);
    }

    .twisty { width: 12px; color: var(--dim); font-family: var(--font); font-size: 10px; flex: 0 0 auto; }
    .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
    .meta { font-family: var(--font); font-size: 10px; color: var(--muted); }
    .row {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 8px; cursor: pointer; user-select: none;
      border-left: 2px solid transparent;
    }
    .row:hover { background: var(--bg-3); }
    .row.sel { background: var(--sel); border-left-color: var(--accent-hot); }
    .row.foc { box-shadow: inset 0 0 0 1px var(--focus); }
    .d0 { padding-left: 8px; }
    .d1 { padding-left: 20px; }
    .d2 { padding-left: 32px; }
    .d3 { padding-left: 44px; }
    .pane-h {
      height: 28px; display: flex; align-items: center; gap: 8px;
      padding: 0 10px; border-bottom: 1px solid var(--line);
      font-family: var(--font); font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
    }
    .scroll { overflow: auto; flex: 1; min-height: 0; }
    input.search {
      width: 100%; padding: 6px 8px; margin: 6px 8px; width: calc(100% - 16px);
      background: var(--bg); border: 1px solid var(--line); color: var(--text);
      font-family: var(--font); font-size: 11px;
    }
    input.search:focus { border-color: var(--line-2); outline: none; }

    .preview {
      height: 100%; display: flex; flex-direction: column; padding: 16px; gap: 12px; min-height: 0;
    }
    .og {
      width: 100%; aspect-ratio: 16/9; background: var(--bg-2);
      border: 1px solid var(--line); display: grid; place-items: end start;
      padding: 10px; font-family: var(--font); font-size: 10px; color: var(--dim);
      background-image:
        linear-gradient(#000 1px, transparent 1px),
        linear-gradient(90deg, #000 1px, transparent 1px);
      background-size: 24px 24px; background-color: #080808;
    }
    .ptitle { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
    .purl { font-family: var(--font); font-size: 11px; color: var(--muted); word-break: break-all; }
    .pbody {
      flex: 1; overflow: auto; color: var(--muted); font-size: 12px; line-height: 1.55;
      white-space: pre-wrap; border-top: 1px solid var(--line); padding-top: 12px;
    }
    .pactions { display: flex; gap: 8px; }
    .btn {
      font-family: var(--font); font-size: 11px; padding: 6px 10px;
      border: 1px solid var(--line-2); background: var(--bg-3); cursor: pointer;
    }
    .btn.pri { background: var(--bg-4); border-color: var(--accent); color: var(--accent-hot); }
    .btn:hover { border-color: var(--accent); }

    /* A — IDE classic: activity + explorer + list + preview */
    .a-shell { flex: 1; display: grid; grid-template-columns: 44px 240px 300px 1fr; min-height: 0; }
    .activity {
      background: var(--bg); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;
    }
    .act {
      width: 32px; height: 32px; display: grid; place-items: center;
      color: var(--dim); font-family: var(--font); font-size: 10px; cursor: pointer;
      border-left: 2px solid transparent;
    }
    .act.on { color: var(--text); border-left-color: var(--accent-hot); }
    .side, .mid, .right {
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
      border-right: 1px solid var(--line); background: var(--bg-1);
    }
    .right { border-right: none; background: var(--bg); }

    /* B — IDE dual: explorer (tree with entries) + editor/preview stack */
    .b-shell { flex: 1; display: grid; grid-template-columns: 44px 300px 1fr; min-height: 0; }
    .b-main { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
    .tabs {
      display: flex; gap: 0; border-bottom: 1px solid var(--line); background: var(--bg-1);
      font-family: var(--font); font-size: 11px;
    }
    .tab {
      padding: 8px 14px; color: var(--muted); border-right: 1px solid var(--line); cursor: pointer;
    }
    .tab.on { color: var(--text); background: var(--bg); border-bottom: 1px solid var(--bg); margin-bottom: -1px; }
    .b-split { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
    .b-editor {
      border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 10px;
      font-family: var(--font); font-size: 12px;
    }
    .field label { display: block; color: var(--dim); font-size: 10px; margin-bottom: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
    .field .val {
      padding: 8px; background: var(--bg-2); border: 1px solid var(--line); color: var(--text);
      min-height: 36px;
    }
    .field .val.multi { min-height: 120px; white-space: pre-wrap; color: var(--muted); }
    .field .val.secret {
      font-family: var(--font); letter-spacing: 0.08em; color: var(--text);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .field .val.secret .mask { color: var(--dim); letter-spacing: 0.2em; }
    .hint {
      font-family: var(--font); font-size: 10px; color: var(--dim);
      border: 1px dashed var(--line-2); padding: 8px; line-height: 1.45;
    }
    .kv {
      display: grid; grid-template-columns: 88px 1fr auto; gap: 6px 10px; align-items: center;
      padding: 8px; background: var(--bg-2); border: 1px solid var(--line);
      font-family: var(--font); font-size: 12px;
    }
    .kv .k { color: var(--dim); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
    .kv .v { color: var(--text); word-break: break-all; }
    .kv .v.masked { color: var(--dim); letter-spacing: 0.18em; }
    .mini { font-family: var(--font); font-size: 10px; color: var(--muted); padding: 2px 6px; border: 1px solid var(--line); cursor: pointer; }
    .mini:hover { color: var(--text); border-color: var(--accent); }

    /* C — IDE bottom panel: explorer + list, Preview as bottom terminal-like panel */
    .c-shell { flex: 1; display: grid; grid-template-columns: 44px 260px 1fr; grid-template-rows: 1fr 240px; min-height: 0; }
    .c-shell .activity { grid-row: 1 / 3; }
    .c-shell .side { grid-row: 1 / 3; }
    .c-list { display: flex; flex-direction: column; border-right: none; background: var(--bg-1); border-bottom: 1px solid var(--line); }
    .c-bottom {
      grid-column: 2 / 4; display: grid; grid-template-columns: 1fr 1.2fr;
      background: var(--bg); border-top: 1px solid var(--line);
    }
    .c-bottom > div { border-right: 1px solid var(--line); min-width: 0; overflow: auto; }
    .c-bottom > div:last-child { border-right: none; }
    table.list { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.list th {
      text-align: left; font-family: var(--font); font-size: 10px; color: var(--dim);
      letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 12px;
      border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg-1);
    }
    table.list td { padding: 7px 12px; border-bottom: 1px solid #111; }
    table.list tr { cursor: pointer; }
    table.list tr:hover td { background: var(--bg-3); }
    table.list tr.sel td { background: var(--sel); }
    table.list tr.foc td { box-shadow: inset 0 0 0 1px var(--focus); }

    #state-dump {
      position: fixed; top: 40px; right: 8px; z-index: 40;
      background: #000e; border: 1px solid var(--line);
      font-family: var(--font); font-size: 10px; color: var(--muted);
      padding: 8px; pointer-events: none; white-space: pre;
    }
    #proto-bar {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      z-index: 50; display: flex; align-items: center; gap: 10px;
      background: #fff; color: #000; padding: 8px 12px; border-radius: 999px;
      font-family: var(--font); font-size: 11px; box-shadow: 0 8px 24px #000c;
    }
    #proto-bar button {
      width: 26px; height: 26px; border-radius: 50%; background: #000; color: #fff; cursor: pointer;
    }
    #proto-bar .lab { min-width: 260px; text-align: center; font-weight: 600; }
    #proto-note {
      position: fixed; left: 10px; bottom: 28px; z-index: 50;
      font-family: var(--font); font-size: 10px; color: var(--dim); line-height: 1.4; max-width: 180px;
    }
  </style>
</head>
<body>
  <div id="root" class="app"></div>
  <pre id="state-dump"></pre>
  <div id="proto-note">PROTOTYPE r2b · TRUE BLACK<br/>B = editor + passwords<br/>← → other layouts</div>
  <div id="proto-bar">
    <button type="button" id="prev">←</button>
    <div class="lab" id="proto-label">A</div>
    <button type="button" id="next">→</button>
  </div>
  <script>
    const ORDER = ["A", "B", "C"];
    const NAMES = {
      A: "IDE tri-pane",
      B: "IDE editor + Preview",
      C: "IDE + bottom Preview",
    };
    const COLS = [
      { id: "c1", name: "Links", d: 0, open: true },
      { id: "c2", name: "Amazon", d: 1, open: false },
      { id: "c3", name: "ebay - GPUs", d: 1, open: false },
      { id: "c4", name: "youtube - games", d: 1, open: true },
      { id: "c5", name: "speedruns", d: 2, open: false },
      { id: "c6", name: "Logins", d: 0, open: true },
      { id: "c7", name: "Work", d: 1, open: true },
      { id: "c8", name: "Home", d: 1, open: false },
    ];
    const ENTRIES = [
      { id: "e1", title: "Celeste Any%", url: "https://youtu.be/celeste-any", body: "WR route notes\npause buffer @ 12:40", col: "youtube - games", updated: "08-07", kind: "link" },
      { id: "e2", title: "Hades heat 16", url: "https://youtu.be/hades-heat", body: "build: aspect of Chiron", col: "youtube - games", updated: "08-05", kind: "link" },
      { id: "e3", title: "GPU listing draft", url: "", body: "seller notes only", col: "ebay - GPUs", updated: "08-01", kind: "note" },
      { id: "e4", title: "Wi‑Fi guest", url: "", body: "ssid: kakuriyo-guest\npassword: blue-teapot-91", col: null, updated: "07-20", kind: "secret", user: "", pass: "blue-teapot-91" },
      { id: "e5", title: "GitHub", url: "https://github.com/login", body: "user: yuuki\npassword: ghp_••••••••••••\n2fa: auth app", col: "Work", updated: "08-08", kind: "secret", user: "yuuki", pass: "correct-horse-battery" },
      { id: "e6", title: "Bank · checking", url: "https://bank.example/login", body: "user: yuuki.okada\npassword: ••••••••••\nrouting note: personal", col: "Work", updated: "08-06", kind: "secret", user: "yuuki.okada", pass: "river-stone-4421" },
      { id: "e7", title: "Steam", url: "https://store.steampowered.com/login", body: "user: nightforge\npassword: ••••••••", col: "Home", updated: "07-30", kind: "secret", user: "nightforge", pass: "ember-latch" },
    ];
    const state = { variant: "B", entryId: "e5", colId: "c7", reveal: false, passMode: "structured" };

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const entry = () => ENTRIES.find((e) => e.id === state.entryId) || null;

    function getV() {
      const p = new URLSearchParams(location.search).get("variant");
      return NAMES[p] ? p : "B";
    }
    function setV(k) {
      const u = new URL(location.href);
      u.searchParams.set("variant", k);
      history.replaceState(null, "", u);
      state.variant = k;
      render();
    }
    function cycle(d) {
      const i = ORDER.indexOf(getV());
      setV(ORDER[(i + d + ORDER.length) % ORDER.length]);
    }

    function badge(e) {
      if (e.kind === "secret") return "•••";
      return e.url ? "url" : "txt";
    }
    function tree(includeEntries) {
      let html = "";
      COLS.forEach((c) => {
        html += `<div class="row d${c.d} ${c.id === state.colId ? "sel" : ""}" data-a="col" data-id="${c.id}" tabindex="0">
          <span class="twisty">${c.open ? "▾" : "▸"}</span>
          <span class="label">${esc(c.name)}</span>
        </div>`;
        if (includeEntries && c.open) {
          ENTRIES.filter((e) => e.col === c.name).forEach((e) => {
            html += `<div class="row d${c.d + 1} ${e.id === state.entryId ? "sel foc" : ""}" data-a="ent" data-id="${e.id}" tabindex="0">
              <span class="twisty">·</span>
              <span class="label">${esc(e.title)}</span>
              <span class="meta">${badge(e)}</span>
            </div>`;
          });
        }
      });
      html += `<div class="row d0 muted"><span class="twisty">·</span><span class="label">Loose Entries</span></div>`;
      html += `<div class="row d1 ${state.entryId === "e4" ? "sel foc" : ""}" data-a="ent" data-id="e4" tabindex="0">
        <span class="twisty">·</span><span class="label">Wi‑Fi guest</span><span class="meta">•••</span>
      </div>`;
      return html;
    }

    function entryList() {
      return ENTRIES.filter((e) => e.col === "youtube - games").map((e) => `
        <div class="row ${e.id === state.entryId ? "sel foc" : ""}" data-a="ent" data-id="${e.id}" tabindex="0">
          <span class="label">${esc(e.title)}</span>
          <span class="meta">${e.url ? "URL" : "—"} · ${e.updated}</span>
        </div>`).join("");
    }

    function preview(e) {
      if (!e) return `<div class="preview muted">Select an Entry</div>`;
      const secretIdle = e.kind === "secret" && !e.url;
      return `<div class="preview">
        ${e.url ? `<div class="og">og:image · vault cache</div>` : `<div class="og" style="place-items:center">${secretIdle ? "no URL — Preview idle (secret Entry)" : "no URL — Preview idle"}</div>`}
        <h2 class="ptitle">${esc(e.title)}</h2>
        <div class="purl">${e.url ? esc(e.url) : "—"}</div>
        <div class="pbody">${e.kind === "secret" && !state.reveal ? "••••••••  (reveal in editor)" : esc(e.body || "")}</div>
        <div class="pactions">
          ${e.url ? `<button class="btn pri" type="button">Open URL</button><button class="btn" type="button">Refresh Preview</button>` : ""}
          ${e.kind === "secret" ? `<button class="btn pri" type="button" data-a="copy-pass">Copy password</button>` : ""}
          <button class="btn" type="button">Edit Entry</button>
        </div>
      </div>`;
    }

    function editorSecret(e) {
      const passShown = state.reveal ? esc(e.pass || "") : "••••••••••••";
      if (state.passMode === "plain") {
        return `
          <div class="hint">Same fields as any Entry — password lives in Body text. No dedicated Password type.</div>
          <div class="field"><label>Title</label><div class="val">${esc(e.title)}</div></div>
          <div class="field"><label>URL</label><div class="val">${e.url ? esc(e.url) : "—"}</div></div>
          <div class="field"><label>Body</label>
            <div class="val multi">${state.reveal ? esc(e.body) : esc(e.body).replace(/password:.*/gi, "password: ••••••••••")}</div>
          </div>
          <div class="pactions">
            <button class="btn" type="button" data-a="toggle-reveal">${state.reveal ? "Hide secrets" : "Reveal Body"}</button>
            <button class="btn pri" type="button">Save</button>
            <button class="btn" type="button">Move…</button>
          </div>`;
      }
      // structured — soft convention UI over Body (still one Entry type)
      return `
        <div class="hint">Prototype affordance: structured rows over Body. Still one Entry type — not a Password product.</div>
        <div class="field"><label>Title</label><div class="val">${esc(e.title)}</div></div>
        <div class="field"><label>URL</label><div class="val">${e.url ? esc(e.url) : "—"}</div></div>
        <div class="kv">
          <div class="k">User</div>
          <div class="v">${esc(e.user || "—")}</div>
          <button class="mini" type="button" data-a="copy-user">Copy</button>
          <div class="k">Password</div>
          <div class="v ${state.reveal ? "" : "masked"}">${passShown}</div>
          <button class="mini" type="button" data-a="toggle-reveal">${state.reveal ? "Hide" : "Show"}</button>
        </div>
        <div class="field"><label>Body (extra notes)</label>
          <div class="val multi" style="min-height:72px">${esc((e.body || "").split("\n").filter((l) => !/^user:|^password:/i.test(l)).join("\n") || "—")}</div>
        </div>
        <div class="pactions">
          <button class="btn pri" type="button" data-a="copy-pass">Copy password</button>
          <button class="btn" type="button">Save</button>
          <button class="btn" type="button">Move…</button>
          <button class="btn" type="button" data-a="pass-mode">Switch to plain Body</button>
        </div>`;
    }

    function editorNormal(e) {
      return `
        <div class="field"><label>Title</label><div class="val">${e ? esc(e.title) : ""}</div></div>
        <div class="field"><label>URL</label><div class="val">${e && e.url ? esc(e.url) : "—"}</div></div>
        <div class="field"><label>Body</label><div class="val multi">${e ? esc(e.body || "") : ""}</div></div>
        <div class="pactions"><button class="btn pri" type="button">Save</button><button class="btn" type="button">Move…</button></div>`;
    }

    function activity() {
      return `<nav class="activity" aria-label="Activity">
        <div class="act on" title="Explorer">EX</div>
        <div class="act" title="Search">SR</div>
        <div class="spacer"></div>
        <div class="act" title="Lock Vault">LK</div>
      </nav>`;
    }

    function titlebar() {
      return `<header class="titlebar">
        <div class="brand"><b>Kakuriyo</b></div>
        <span class="muted" style="font-family:var(--font);font-size:11px">Vault · unlocked</span>
        <div class="spacer"></div>
        <button class="tb-btn" type="button">Export</button>
        <button class="tb-btn" type="button">Lock</button>
      </header>`;
    }
    function status(extra) {
      return `<footer class="statusbar"><span>Ln tree</span><span>${extra || ""}</span><div class="spacer"></div><span>UTF-8</span><span>local · no telemetry</span></footer>`;
    }

    function renderA() {
      const e = entry();
      return `${titlebar()}
        <div class="a-shell">
          ${activity()}
          <aside class="side">
            <div class="pane-h">Explorer</div>
            <input class="search" placeholder="Filter Collections…" />
            <div class="scroll">${tree(false)}</div>
          </aside>
          <section class="mid">
            <div class="pane-h">Entries · youtube - games</div>
            <div class="scroll">${entryList()}</div>
          </section>
          <section class="right">
            <div class="pane-h">Preview</div>
            <div class="scroll">${preview(e)}</div>
          </section>
        </div>
        ${status("A · Collections | Entries | Preview")}`;
    }

    function renderB() {
      const e = entry();
      return `${titlebar()}
        <div class="b-shell">
          ${activity()}
          <aside class="side">
            <div class="pane-h">Explorer</div>
            <input class="search" placeholder="Jump…" />
            <div class="scroll">${tree(true)}</div>
          </aside>
          <section class="b-main">
            <div class="tabs">
              <div class="tab on">${e ? esc(e.title) : "Entry"}</div>
              <div class="tab muted">${e && e.kind === "secret" ? "Preview (weak without URL)" : "Preview"}</div>
            </div>
            <div class="b-split">
              <div class="b-editor">
                ${e && e.kind === "secret" ? editorSecret(e) : editorNormal(e)}
              </div>
              <div class="scroll">${preview(e)}</div>
            </div>
          </section>
        </div>
        ${status("B · password sample · " + state.passMode + (state.reveal ? " · revealed" : " · masked"))}`;
    }

    function renderC() {
      const e = entry();
      const rows = ENTRIES.map((x) => `
        <tr class="${x.id === state.entryId ? "sel foc" : ""}" data-a="ent" data-id="${x.id}" tabindex="0">
          <td>${esc(x.title)}</td>
          <td class="meta">${x.col || "root"}</td>
          <td class="meta">${x.url ? "URL" : "—"}</td>
          <td class="meta">${x.updated}</td>
        </tr>`).join("");
      return `${titlebar()}
        <div class="c-shell">
          ${activity()}
          <aside class="side">
            <div class="pane-h">Explorer</div>
            <div class="scroll">${tree(false)}</div>
          </aside>
          <section class="c-list">
            <div class="pane-h">Entries</div>
            <div class="scroll">
              <table class="list">
                <thead><tr><th>Title</th><th>Collection</th><th>URL</th><th>Updated</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </section>
          <div class="c-bottom">
            <div>
              <div class="pane-h">Entry</div>
              <div style="padding:12px;font-family:var(--font);font-size:12px;line-height:1.5">
                <div>${e ? esc(e.title) : "—"}</div>
                <div class="muted" style="margin-top:6px">${e && e.url ? esc(e.url) : "no URL"}</div>
                <div class="muted" style="margin-top:10px;white-space:pre-wrap">${e ? esc(e.body || "") : ""}</div>
              </div>
            </div>
            <div>
              <div class="pane-h">Preview</div>
              ${preview(e)}
            </div>
          </div>
        </div>
        ${status("C · list main · Preview dock bottom")}`;
    }

    function dump() {
      const e = entry();
      document.getElementById("state-dump").textContent =
        `variant ${state.variant} (${NAMES[state.variant]})\n` +
        `collection ${state.colId}\n` +
        `entry ${e ? e.title : "-"} (${e ? e.kind : "-"})\n` +
        `passMode ${state.passMode} reveal ${state.reveal}\n` +
        `palette TRUE BLACK`;
    }

    function render() {
      state.variant = getV();
      document.getElementById("root").innerHTML = ({ A: renderA, B: renderB, C: renderC })[state.variant]();
      document.getElementById("proto-label").textContent = `${state.variant} — ${NAMES[state.variant]}`;
      dump();
    }

    document.getElementById("root").addEventListener("click", (ev) => {
      const el = ev.target.closest("[data-a]");
      if (!el) return;
      if (el.dataset.a === "ent") { state.entryId = el.dataset.id; state.reveal = false; }
      if (el.dataset.a === "col") state.colId = el.dataset.id;
      if (el.dataset.a === "toggle-reveal") state.reveal = !state.reveal;
      if (el.dataset.a === "pass-mode") state.passMode = state.passMode === "structured" ? "plain" : "structured";
      if (el.dataset.a === "copy-pass" || el.dataset.a === "copy-user") {
        /* prototype — no real clipboard */
      }
      render();
    });
    document.getElementById("prev").onclick = () => cycle(-1);
    document.getElementById("next").onclick = () => cycle(1);
    document.addEventListener("keydown", (ev) => {
      const t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
      if (ev.key === "ArrowLeft") { ev.preventDefault(); cycle(-1); }
      if (ev.key === "ArrowRight") { ev.preventDefault(); cycle(1); }
    });
    render();
  </script>
</body>
</html>
