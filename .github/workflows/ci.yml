name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # scriptc's C backend: zig cc bundles clang + sysroots on CI runners
  # that ship no system clang (same as shell.nix on NixOS).
  SCRIPTC_CC: zigcc

jobs:
  gates:
    name: Gate suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install GTK and pkg-config
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config

      - name: Install npm dependencies
        run: |
          npm install
          npm install --prefix vendor/native-sdk/packages/core

      - name: Install native CLI
        run: npm install -g @native-sdk/cli@0.8.3

      - name: Run gates
        run: npm run gate
